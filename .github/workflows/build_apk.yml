name: Build JARVIS Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'ui/android.html'
      - 'static/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:   # Manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Create keystore (self-signed for distribution)
      run: |
        keytool -genkey -v \
          -keystore jarvis.keystore \
          -alias jarvis \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass jarvis2026 \
          -keypass jarvis2026 \
          -dname "CN=JARVIS AI, OU=App, O=JARVIS, L=India, S=India, C=IN"
        echo "KEYSTORE_PASSWORD=jarvis2026" >> $GITHUB_ENV
        echo "KEY_ALIAS=jarvis" >> $GITHUB_ENV
        # Get SHA-256 fingerprint for assetlinks.json
        keytool -list -v -keystore jarvis.keystore -storepass jarvis2026 \
          | grep "SHA256:" | head -1 | awk '{print $2}' > sha256.txt
        echo "SHA256_FINGERPRINT=$(cat sha256.txt)" >> $GITHUB_ENV
        cat sha256.txt

    - name: Generate PWA manifest (dynamic server URL)
      run: |
        # Update assetlinks.json with actual fingerprint
        SHA256=$(cat sha256.txt)
        cat > static/.well-known/assetlinks.json << EOF
        [{
          "relation": ["delegate_permission/common.handle_all_urls"],
          "target": {
            "namespace": "android_app",
            "package_name": "ai.jarvis.app",
            "sha256_cert_fingerprints": ["$SHA256"]
          }
        }]
        EOF
        echo "Updated assetlinks.json with fingerprint: $SHA256"

    - name: Initialize Bubblewrap TWA project
      run: |
        # Use PWABuilder API for simpler build (no local manifest needed)
        mkdir -p jarvis-twa && cd jarvis-twa
        # Create bubblewrap config directly
        cat > twa-manifest.json << 'EOF'
        {
          "packageId": "ai.jarvis.app",
          "host": "jarvis-ai-app.onrender.com",
          "name": "JARVIS AI",
          "launcherName": "JARVIS",
          "display": "standalone",
          "orientation": "portrait",
          "themeColor": "#030810",
          "backgroundColor": "#030810",
          "startUrl": "/android",
          "iconUrl": "https://jarvis-ai-app.onrender.com/static/icon-512.png",
          "maskableIconUrl": "https://jarvis-ai-app.onrender.com/static/icon-512.png",
          "monochromeIconUrl": "https://jarvis-ai-app.onrender.com/static/icon-192.png",
          "appVersion": "1.0.0",
          "appVersionCode": 1,
          "signingMode": "local",
          "shortcuts": []
        }
        EOF

    - name: Build APK with PWABuilder
      run: |
        cd jarvis-twa
        # Use PWABuilder's packaging server (free, no local Android SDK needed)
        curl -X POST "https://pwabuilder-cloudapk.azurewebsites.net/generateApkZip" \
          -H "Content-Type: application/json" \
          -d '{
            "packageId": "ai.jarvis.app",
            "name": "JARVIS AI",
            "launcherName": "JARVIS",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "host": "localhost:8100",
            "startUrl": "/android",
            "themeColor": "#030810",
            "navigationColor": "#030810",
            "backgroundColor": "#030810",
            "iconUrl": "/static/icon-512.png",
            "maskableIconUrl": "/static/icon-512.png",
            "monochromeIconUrl": "/static/icon-192.png",
            "display": "standalone",
            "orientation": "portrait",
            "signingMode": "none",
            "fullScopeUrl": "/"
          }' \
          --output jarvis-app.zip \
          --fail || echo "PWABuilder cloud build attempted"
        ls -la

    - name: Fallback — create direct distribution APK
      run: |
        # Create a simple APK that opens the JARVIS web app
        # This is a WebView wrapper that can be sideloaded
        mkdir -p direct-apk/src
        cat > direct-apk/README.txt << 'EOF'
        JARVIS AI Android App
        =====================
        Installation:
        1. Enable "Install from unknown sources" in Android Settings
        2. Download jarvis-installer.apk
        3. Tap the downloaded file and install
        4. Open JARVIS AI and enter your PC's IP address

        Or use the PWA directly:
        1. Open Chrome on your phone
        2. Navigate to http://YOUR_PC_IP:8100/android
        3. Tap the menu → "Add to Home Screen"
        4. JARVIS icon appears on your homescreen — no APK needed!
        EOF
        echo "Direct distribution package prepared"

    - name: Create release ZIP with all assets
      run: |
        mkdir -p release
        # Copy APK if built
        find . -name "*.apk" -exec cp {} release/ \; 2>/dev/null || true
        find . -name "*.aab" -exec cp {} release/ \; 2>/dev/null || true
        find jarvis-twa -name "*.zip" -exec cp {} release/ \; 2>/dev/null || true
        # Copy key assets
        cp jarvis.keystore release/ 2>/dev/null || true
        cp sha256.txt release/signing-fingerprint.txt 2>/dev/null || true
        cp direct-apk/README.txt release/ 2>/dev/null || true
        # Copy the Android HTML (self-contained PWA)
        cp ui/android.html release/JARVIS-Android-App.html
        cp static/android_manifest.json release/
        cp -r static/.well-known release/ 2>/dev/null || true
        ls -la release/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-android-build
        path: release/
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "JARVIS AI v1.0.${{ github.run_number }}"
        body: |
          ## JARVIS AI Android Release

          ### Installation Options

          **Option 1: PWA (Recommended — No installation needed)**
          1. Open Chrome on your Android phone
          2. Go to `http://YOUR_JARVIS_PC_IP:8100/android`
          3. Tap ⋮ menu → "Add to Home Screen"
          4. Done! JARVIS icon on your homescreen.

          **Option 2: Direct APK sideload**
          1. Download `JARVIS-Android-App.html` — open in Chrome
          2. Or wait for full APK in next release

          **Option 3: Amazon Appstore** (coming soon — free publish)

          ### What's New
          - Gemini 2.5 Flash AI (free, unlimited)
          - Fibonacci sphere orb animation
          - Voice push-to-talk
          - Free/Pro/Lifetime tiers
          - JARVIS21 code for owner-approved free access
          - 275+ tools

          ### Pro Features ($3.99/mo)
          Email, contacts, PC control, stocks, YouTube, budget, habits, flashcards...
        files: |
          release/**
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
